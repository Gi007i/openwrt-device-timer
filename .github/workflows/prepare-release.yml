name: Prepare Release

on:
  push:
    branches: ['release/**']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#release/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Preparing release v${VERSION}"
          echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "ERROR: Invalid version ${VERSION}"; exit 1; }

      - name: Prepare release commit
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Squash-merge
          git checkout main
          git merge --squash "origin/${GITHUB_REF_NAME}"
          # Set PKG_VERSION in Makefile
          sed -i "s|^PKG_VERSION:=.*|PKG_VERSION:=${VERSION}|" src/luci-app-device-timer/Makefile
          # Check DO_RELEASE flag
          DO_RELEASE=$(grep '^DO_RELEASE:=' src/luci-app-device-timer/Makefile | cut -d= -f2)
          git add -A
          if [ "${DO_RELEASE}" = "1" ]; then
            # Full release: commit, tag, push
            git commit -m "feat: release v${VERSION} device timer package"
            git tag "v${VERSION}"
            git push origin main
            git push origin "v${VERSION}"
            # Cross-push to GitLab
            git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Gi007i/openwrt-device-timer.git" main
            git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Gi007i/openwrt-device-timer.git" "v${VERSION}"
          else
            # Merge only: no tag, no build
            git commit -m "feat: release v${VERSION} device timer package"
            git push origin main
            git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Gi007i/openwrt-device-timer.git" main
          fi
          # Delete release branch
          git push origin --delete "${GITHUB_REF_NAME}"
